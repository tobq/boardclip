name: Build desktop binaries

# Continuous delivery: every push to main that touches app code rebuilds the
# installers and republishes the rolling "latest" GitHub release the website
# download button points at (/releases/latest/download/...). Keeps the installer
# in lockstep with the git-based auto-update. Site-only / docs-only pushes are
# skipped (Netlify handles those). Manual runs via workflow_dispatch.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      # Pure marketing/docs only. site/shared/** is shared UI the APP bundles, so
      # it is deliberately NOT ignored (those changes must rebuild the installer).
      - 'site/index.html'
      - 'site/styles.css'
      - 'site/assets/**'
      - '**/*.md'
      - '.github/workflows/netlify.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            runner: windows-2025
            script: dist:win
            prepare_assets: |
              New-Item -ItemType Directory -Force release | Out-Null
              Copy-Item "dist/BoardClip Setup *.exe" "release/BoardClip-Setup-Windows.exe"
              Copy-Item (Get-ChildItem dist -Filter "*.exe" | Where-Object { $_.Name -notlike "*Setup*" } | Select-Object -First 1).FullName "release/BoardClip-Windows-Portable.exe"
            artifacts: |
              release/*.exe
          # ONE universal app (Apple Silicon + Intel in one bundle), so nobody
          # picks an architecture.
          - name: macOS
            runner: macos-15
            script: dist:mac
            prepare_assets: |
              New-Item -ItemType Directory -Force release | Out-Null
              # Universal output only: an arch-specific build (no universal file) fails here.
              Copy-Item (Get-ChildItem dist -Filter "BoardClip-*-universal.dmg" | Select-Object -First 1).FullName "release/BoardClip-macOS.dmg"
              Copy-Item (Get-ChildItem dist -Filter "BoardClip-*-universal-mac.zip" | Select-Object -First 1).FullName "release/BoardClip-macOS.zip"
            artifacts: |
              release/*.dmg
              release/*.zip
          - name: Linux
            runner: ubuntu-24.04
            script: dist:linux
            prepare_assets: |
              New-Item -ItemType Directory -Force release | Out-Null
              Copy-Item "dist/BoardClip-*.AppImage" "release/BoardClip-Linux.AppImage"
              Copy-Item "dist/boardclip_*_amd64.deb" "release/BoardClip-Linux.deb"
            artifacts: |
              release/*.AppImage
              release/*.deb

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # macOS signing + notarisation switch on by themselves once these
      # secrets exist (a Developer ID Application certificate as base64 .p12
      # + its password, and an Apple ID app-specific password + team id);
      # without them the build is unsigned, as before. Windows never sees them.
      - name: Build binaries
        run: npm run ${{ matrix.platform.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform.name == 'macOS' && secrets.MAC_CSC_LINK != '' }}
          CSC_LINK: ${{ matrix.platform.name == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform.name == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform.name == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform.name == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform.name == 'macOS' && secrets.APPLE_TEAM_ID || '' }}

      - name: Prepare release assets
        shell: pwsh
        run: ${{ matrix.platform.prepare_assets }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: boardclip-${{ matrix.platform.name }}
          path: ${{ matrix.platform.artifacts }}
          if-no-files-found: error

  publish:
    name: Publish latest build
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      # One rolling release (tag "latest"), refreshed every run + marked as the
      # repo's latest, so /releases/latest/download/<asset> always serves the
      # current build. Versioned v* releases (if ever cut) archive alongside it.
      - name: Publish rolling "latest" release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          prerelease: false
          make_latest: true
          files: release/*
          body: |
            Rolling build from `${{ github.sha }}`, auto-published on every push to `main`.

      # A name this build no longer makes (the per-architecture macOS files
      # before the universal app) goes, so the rolling release only ever
      # serves current binaries.
      - name: Drop stale assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r name; do
            if [ ! -e "release/$name" ]; then gh release delete-asset latest "$name" --repo "$GITHUB_REPOSITORY" --yes; fi
          done

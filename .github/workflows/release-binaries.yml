name: Build desktop binaries

# Continuous delivery: every push to main that touches app code builds the
# installers and publishes them as a new numbered release, v<major.minor>.<run>
# (e.g. v2.1.104), marked as the repo's latest. The website's download links
# (/releases/latest/download/<asset>) keep working because every release uses
# the same asset names. Numbered releases are what package managers need: the
# Homebrew cask and the Scoop manifest in tobq/homebrew-tap pin a version
# + sha256 (SHA256SUMS.txt), and that repo bumps itself from here. Site-only /
# docs-only pushes are skipped (Netlify handles those). Manual runs via
# workflow_dispatch; a run on any other branch builds but never publishes.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      # Pure marketing/docs only. site/shared/** is shared UI the APP bundles, so
      # it is deliberately NOT ignored (those changes must rebuild the installer).
      - 'site/index.html'
      - 'site/styles.css'
      - 'site/assets/**'
      - '**/*.md'
      - '.github/workflows/netlify.yml'

permissions:
  contents: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # major.minor from package.json, patch = this workflow's run number: monotonic,
      # no manual bumps, and a re-run of the same run rebuilds the same version.
      - id: v
        run: echo "version=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform.name }}
    needs: version
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            runner: windows-2025
            script: dist:win
            prepare_assets: |
              New-Item -ItemType Directory -Force release | Out-Null
              Copy-Item "dist/BoardClip Setup *.exe" "release/BoardClip-Setup-Windows.exe"
              Copy-Item (Get-ChildItem dist -Filter "*.exe" | Where-Object { $_.Name -notlike "*Setup*" } | Select-Object -First 1).FullName "release/BoardClip-Windows-Portable.exe"
            artifacts: |
              release/*.exe
          # ONE universal app (Apple Silicon + Intel in one bundle), so nobody
          # picks an architecture.
          - name: macOS
            runner: macos-15
            script: dist:mac
            prepare_assets: |
              New-Item -ItemType Directory -Force release | Out-Null
              # Universal output only: an arch-specific build (no universal file) fails here.
              Copy-Item (Get-ChildItem dist -Filter "BoardClip-*-universal.dmg" | Select-Object -First 1).FullName "release/BoardClip-macOS.dmg"
              Copy-Item (Get-ChildItem dist -Filter "BoardClip-*-universal-mac.zip" | Select-Object -First 1).FullName "release/BoardClip-macOS.zip"
            artifacts: |
              release/*.dmg
              release/*.zip
          - name: Linux
            runner: ubuntu-24.04
            script: dist:linux
            prepare_assets: |
              New-Item -ItemType Directory -Force release | Out-Null
              Copy-Item "dist/BoardClip-*.AppImage" "release/BoardClip-Linux.AppImage"
              Copy-Item "dist/boardclip_*_amd64.deb" "release/BoardClip-Linux.deb"
            artifacts: |
              release/*.AppImage
              release/*.deb

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The app, the installer metadata and the release tag all carry one version.
      - name: Stamp version
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version

      # macOS signing, in order of preference:
      # 1. Developer ID (+ notarisation): switches on by itself once these
      #    secrets exist (a Developer ID Application certificate as base64 .p12
      #    + its password, and an Apple ID app-specific password + team id).
      # 2. The project's own self-signed certificate (MAC_SELF_SIGN_P12 +
      #    MAC_SELF_SIGN_PASSWORD; its public half is assets/boardclip-selfsign.pem).
      #    Not notarised, so Gatekeeper still asks once, like ad-hoc, BUT the
      #    designated requirement names this certificate instead of the build's
      #    hash, so macOS keeps the Accessibility permission (needed to paste)
      #    across updates. electron-builder only lists TRUSTED identities, so the
      #    certificate is trusted for code signing on the runner first.
      # 3. Neither: electron-builder's ad-hoc signature, as before.
      # The electron-builder variables are exported ONLY when a certificate
      # exists: an EMPTY CSC_LINK is read as a path (the project folder) and
      # fails the signing step with "... not a file". Windows never sees them.
      - name: Build binaries
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform.name }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_SELF_SIGN_P12: ${{ secrets.MAC_SELF_SIGN_P12 }}
          MAC_SELF_SIGN_PASSWORD: ${{ secrets.MAC_SELF_SIGN_PASSWORD }}
        run: |
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          if [ "$PLATFORM" = "macOS" ] && [ -n "$MAC_CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=true CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            if [ -n "$MAC_APPLE_ID" ]; then
              export APPLE_ID="$MAC_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_APP_SPECIFIC_PASSWORD" APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
            fi
          elif [ "$PLATFORM" = "macOS" ] && [ -n "$MAC_SELF_SIGN_P12" ]; then
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain assets/boardclip-selfsign.pem
            export CSC_IDENTITY_AUTO_DISCOVERY=true CSC_LINK="$MAC_SELF_SIGN_P12" CSC_KEY_PASSWORD="$MAC_SELF_SIGN_PASSWORD" CSC_NAME="BoardClip Self-Signed"
          fi
          npm run ${{ matrix.platform.script }}

      # A broken or missing signature on a quarantined app reads as "BoardClip is
      # damaged" on Apple silicon, and a signature that names no certificate loses
      # the Accessibility permission on every update: fail the build instead.
      - name: Check macOS signature
        if: matrix.platform.name == 'macOS'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_SELF_SIGN_P12: ${{ secrets.MAC_SELF_SIGN_P12 }}
        run: |
          APP=dist/mac-universal/BoardClip.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          # -dvv: the Authority (certificate) lines only appear at verbosity 2.
          INFO=$(codesign -dvv "$APP" 2>&1); echo "$INFO"
          REQ=$(codesign -d -r- "$APP" 2>&1); echo "$REQ"
          if [ -n "$MAC_CSC_LINK" ]; then
            echo "$INFO" | grep -q 'Authority=Developer ID Application'
          elif [ -n "$MAC_SELF_SIGN_P12" ]; then
            echo "$INFO" | grep -q 'Authority=BoardClip Self-Signed'
            echo "$REQ" | grep -q 'certificate'
          else
            echo "$INFO" | grep -q 'Signature=adhoc'
          fi

      - name: Prepare release assets
        shell: pwsh
        run: ${{ matrix.platform.prepare_assets }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: boardclip-${{ matrix.platform.name }}
          path: ${{ matrix.platform.artifacts }}
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-24.04
    needs: [version, build]
    if: github.ref == 'refs/heads/main'
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      # The package managers read the hashes from here instead of downloading
      # every installer again.
      - name: Checksums
        working-directory: release
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish v${{ needs.version.outputs.version }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: BoardClip ${{ needs.version.outputs.version }}
          prerelease: false
          make_latest: true
          files: release/*
          body: |
            Built from `${{ github.sha }}` on every push to `main`.

            - macOS: `brew install --cask tobq/tap/boardclip`, or BoardClip-macOS.dmg (Apple Silicon + Intel)
            - Windows: BoardClip-Setup-Windows.exe, or `scoop bucket add tobq https://github.com/tobq/homebrew-tap` then `scoop install tobq/boardclip`
            - Linux: BoardClip-Linux.AppImage / BoardClip-Linux.deb
            - Any OS with Node.js: `npm i -g boardclip`, or try it with `npx boardclip`

      # The rolling "latest" release (one release re-uploaded on every push) was
      # replaced by these numbered releases on 9 Oct 2026. Its tag literally named
      # "latest" must not linger next to /releases/latest, so it goes once the new
      # release is live (a no-op once it is gone).
      - name: Remove the old rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi

  # The same version on npm (npm i -g boardclip / npx boardclip) once an
  # NPM_TOKEN secret exists (an npmjs.com granular token allowed to publish);
  # without it the job only leaves a notice. The package is the repo's runtime
  # files (build.files) with Electron as a real dependency, see
  # scripts/prepare-npm-package.js. It is installed and run before publishing.
  npm:
    name: Publish to npm
    runs-on: ubuntu-24.04
    needs: [version, publish]
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: No npm token yet
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "::notice::No NPM_TOKEN secret, so boardclip@$VERSION was not published to npm."

      - name: Checkout
        if: env.NODE_AUTH_TOKEN != ''
        uses: actions/checkout@v6

      - name: Setup Node
        if: env.NODE_AUTH_TOKEN != ''
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Build and smoke-test the package
        if: env.NODE_AUTH_TOKEN != ''
        run: |
          node scripts/prepare-npm-package.js "$VERSION"
          npm pack
          npm install --global "./boardclip-$VERSION.tgz"
          test "$(boardclip --version)" = "$VERSION"
          node -e "const p = require(require('path').join(process.argv[1], 'boardclip/node_modules/electron')); require('fs').accessSync(p); console.log('electron:', p)" "$(npm root --global)"

      - name: Publish boardclip@${{ needs.version.outputs.version }}
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish "./boardclip-$VERSION.tgz" --access public --provenance

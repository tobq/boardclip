<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Clipboard</title>
<script>
  document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
</script>
<link rel="stylesheet" href="site/shared/clipboard-popup.css">
<link rel="stylesheet" href="site/shared/clipboard-window.css">
<style>
  /* Tokens + every popup component style live in the shared clipboard-popup.css
     (single source of truth with the website demo); the window base (reset,
     font, background, glass scrim) in clipboard-window.css. Only the popup
     shell's own layout stays here. */
  body { display:flex; flex-direction:column; }
  #popupShell { flex:1; min-height:0; height:100%; display:flex; flex-direction:column; overflow:hidden; }
</style></head><body>

<div id="popupShell"></div>

<!-- Confirm + prompt dialogs are created by the shared Core.createDialogs. -->
<div class="toast" id="toast">Copied</div>

<script src="site/shared/clip-search.js"></script>
<script src="site/shared/clipboard-ui-core.js"></script>
<script>
const Core = window.BoardClipCore;
document.getElementById('popupShell').innerHTML = Core.renderPopupShell({
  settingsBodyHtml: Core.renderSettingsBody(),
  headerActionsHtml: '<button class="icon-btn accent" id="newNoteBtn" type="button" title="New note" aria-label="New note"><span class="mi">edit_note</span></button>',
});
const listEl = document.getElementById('list');
const toast = document.getElementById('toast');
const searchEl = document.getElementById('search');
const countEl = document.getElementById('count');
const regexBtn = document.getElementById('regexBtn');
let toastTimer, items = [], query = '', regexOn = false;
let filtered = [];
let groups = [];
// The search box TEXT is the single source of truth. Facets (group:/is:/num:/since:…) live
// as tokens inside `query`; the chip bar's active/excluded state is DERIVED from it. No
// separate filter Sets (that dual-model was the drift Forge killed).
function parsedQuery() { return Core.search.parseQuery(query); }
function facetState() { return Core.search.facetState(parsedQuery()); }
function activeFilterSet() { return facetState().active; }
// Ranking override for the Best/Recent toggle: null = default (relevance while searching,
// history order when idle), 'best' | 'new' when the user has flipped it for this query.
let sortMode = null;
let controller = null;
let dataRevision = -1;
let diagnosticsEnabled = false;
// Per history revision (rebuildItemIndexes), never per keystroke: the search
// docs + lowercased haystacks for Core.filterItemIndexes.
let searchDocs = [], searchTextLower = [];
let itemLookup = new Map(), groupCounts = new Map(), builtinCounts = {}, numpadIdMap = {};

document.getElementById('newNoteBtn').addEventListener('click', () => {
  window.api.newNote({ sourceGroups: Core.sourceGroupsFromFilters(activeFilterSet()) });
});

// Renderer exceptions used to vanish (a tray popup has no DevTools open): a thrown
// handler left the UI half-updated with nothing in the log. Route window errors +
// unhandled rejections into the diagnostics file (always written, not gated on the
// diagnostics toggle) so they sit next to the perf events.
Core.installRendererErrorReporting((details) => {
  const promise = window.api.recordDiagnostics?.('error', details);
  if (promise && promise.catch) promise.catch(() => {});
});

function recordRendererPerf(event, startedAt, details = {}, thresholdMs = 50) {
  const ms = performance.now() - startedAt;
  if (!diagnosticsEnabled && ms < thresholdMs) return ms;
  const promise = window.api.recordDiagnostics?.(event, {
    ...details,
    ms: Math.round(ms),
    items: items.length,
    filtered: filtered.length,
    query_length: query.length,
    filters: (() => { const fs = facetState(); return fs.active.size + fs.excluded.size; })(),
    slow: ms >= thresholdMs,
  });
  if (promise && promise.catch) promise.catch(() => {});
  return ms;
}

let themeMode = 'system';
let systemDark = matchMedia('(prefers-color-scheme: dark)').matches;
function refreshTheme() {
  Core.applyTheme(document.documentElement, themeMode, systemDark);
  Core.setActiveThemeSeg(document.getElementById('themeMode'), themeMode);
}
function applyColorScheme(scheme) {
  systemDark = scheme !== 'light';
  refreshTheme();
}
function setThemeMode(mode) {
  themeMode = (mode === 'light' || mode === 'dark') ? mode : 'system';
  refreshTheme();
}
if (window.api.getColorScheme) window.api.getColorScheme().then(applyColorScheme).catch(() => {});
if (window.api.onColorSchemeChanged) window.api.onColorSchemeChanged(applyColorScheme);
// Appearance (surface, accent, density, corners, borders): the SAME payload
// main sends every window (appearanceVariantPayload: runtime_info.appearance at
// start, then 'appearance-changed'), so the popup can never render with other
// values than the editor / viewer / approval windows. Main already resolved it:
// the surface against OS support, borders gated on BOARDCLIP_DEBUG_VARIANTS
// (the tags-look-different-per-machine bug of 2026-09-02). All ride data-* on <html>
// through the shared Core.applyAppearance (the System / Custom accent included).
// A partial update (the surface alone) merges into the last full payload.
let currentLook = {};
let settingsUi = null; // Core.mountSettings, bound below
function applyAppearance(look) {
  if (!look) return;
  currentLook = { ...currentLook, ...look };
  if (look.themeMode) setThemeMode(look.themeMode);
  Core.applyAppearance(document.documentElement, currentLook);
  if (settingsUi) settingsUi.update(appearanceControlsState(currentLook));
}
// The Settings > Appearance controls' state from a payload (the surface
// SETTING and glass support come from get-settings, see openSettings).
function appearanceControlsState(look) {
  return { accentMode: look.accentMode, accentCustom: look.accentCustom, systemAccent: look.systemAccent, glassScope: look.glassScope, uiDensity: look.uiDensity, uiCorners: look.uiCorners };
}
if (window.api.getSettings) window.api.getSettings().then(s => {
  if (!s) return;
  if (s.theme_mode) setThemeMode(s.theme_mode);
  const rt = s.runtime_info || {};
  applyAppearance({ ...(rt.appearance || {}), surfaceStyle: rt.surface_style || 'solid' });
  if (s.image_preview_height != null) imageZoom.load(s.image_preview_height);
  searchBox.setOptionsHeight(s.options_panel_height);
  // The saved regex toggle applies from the first open (it used to wait for Settings).
  regexOn = !!s.regex_search;
  regexBtn.classList.toggle('active', regexOn);
  searchBox.refresh();
}).catch(() => {});
if (window.api.onSurfaceChanged) window.api.onSurfaceChanged((style) => applyAppearance({ surfaceStyle: style === 'solid' ? 'solid' : 'glass' }));
if (window.api.onAppearanceChanged) window.api.onAppearanceChanged(applyAppearance);

// --- Helpers ---
function ago(ts) { return Core.ago(ts); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function providerName(acc) {
  const provider = acc && acc.provider ? String(acc.provider) : 'cloud';
  return provider.charAt(0).toUpperCase() + provider.slice(1);
}
function syncAccountLabel(acc) {
  if (acc && acc.provider === 'custom') return `Custom folder · ${acc.label || acc.path}`;
  return `${providerName(acc)} · ${acc.label || acc.email || acc.path}`;
}
// --- Pin model helpers ---
// item.pin: null/undefined = unpinned. Object = pinned. Shape: { number?: 1-9, groups?: string[] }
function isPinned(item) { return Core.isPinned(item); }
function numpadOf(item) { return Core.numpadOf(item); }
function groupsOf(item) { return Core.groupsOf(item); }
function itemId(item) { return Core.itemId(item); }
function itemById(id) { return itemLookup.get(id) || items.find(it => itemId(it) === id); }
function showToast(msg) { toast.textContent = msg||'Copied'; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(()=>toast.classList.remove('show'),1200); }

// Per-clip search data, keyed by the item OBJECT: a history delta keeps
// unchanged clips' objects, so only new or changed clips are lowercased and
// re-docced (a full rebuild lowercased all 70 MB, ~300 ms, on every refresh).
let searchIndexCache = new WeakMap();
function searchIndexFor(item) {
  let entry = searchIndexCache.get(item);
  if (!entry) {
    const searchText = Core.itemSearchText(item);
    entry = { hay: searchText.toLowerCase(), doc: Core.search.clipToDoc(item), bytes: searchText.length };
    searchIndexCache.set(item, entry);
  }
  return entry;
}
function rebuildItemIndexes() {
  const startedAt = performance.now();
  searchDocs = [];
  searchTextLower = [];
  let searchTextBytes = 0;
  let indexed = 0;
  itemLookup = new Map();
  groupCounts = new Map();
  builtinCounts = { __pinned__: 0, __numbered__: 0, __images__: 0 };
  numpadIdMap = {};

  items.forEach((item) => {
    const id = itemId(item);
    if (id) itemLookup.set(id, item);
    if (isPinned(item)) builtinCounts.__pinned__ += 1;
    if (item && item.type === 'image') builtinCounts.__images__ += 1;
    const slot = numpadOf(item);
    if (slot != null) {
      builtinCounts.__numbered__ += 1;
      numpadIdMap[slot] = id;
    }
    groupsOf(item).forEach((group) => groupCounts.set(group, (groupCounts.get(group) || 0) + 1));
    if (!searchIndexCache.has(item)) indexed += 1;
    const entry = searchIndexFor(item);
    searchTextBytes += entry.bytes;
    searchTextLower.push(entry.hay);
    searchDocs.push(entry.doc);
  });
  filterBarKey = ''; // counts may have changed
  recordRendererPerf('indexes.rebuild', startedAt, {
    search_text_bytes: searchTextBytes,
    indexed,
    groups: groupCounts.size,
    numbered: builtinCounts.__numbered__ || 0,
    images: builtinCounts.__images__ || 0,
  }, 75);
}

// --- Numpad slot map ---
function numpadMap() {
  return numpadIdMap;
}

// --- Group filter tags ---
// The bar depends on the facet tokens, whether there is any query text, the
// groups and the counts - NOT on the free text being typed, so typing a word
// no longer rebuilds it on every letter (~13 ms each on a 25-group bar).
// The availability census (which chips would show anything under the other
// filters) is cached on the filters, the history (searchDocs) and the minute:
// typing words never recomputes it. One cache for the chip bar AND the
// options panel.
const censusCache = Core.createCensusCache({ docs: () => searchDocs, groups: () => groups, onUpdate: () => renderGroupFilters() });
let filterBarKey = '';
let lastCensusId = 0;
function renderGroupFilters() {
  const startedAt = performance.now();
  const el = document.getElementById('groupFilters');
  const fs = facetState();
  const census = censusCache.get(parsedQuery());
  // A new census (the history or the filters changed): the open options
  // panel's chips follow it too.
  if (census.id !== lastCensusId) { lastCensusId = census.id; queueMicrotask(() => { if (searchBox.isOptionsOpen()) searchBox.refresh(); }); }
  const key = JSON.stringify([[...fs.active].sort(), [...fs.excluded].sort(), !!query, groups, census.id]);
  if (key === filterBarKey) return;
  filterBarKey = key;
  el.innerHTML = Core.renderFilterBar({ items, groups, activeFilters: fs.active, excludedFilters: fs.excluded, query, builtinCounts, groupCounts, census });
  recordRendererPerf('filters.render_bar', startedAt, { groups: groups.length }, 40);
}

// The shared list keeps your place across every rebuild (Core.createClipList +
// the resolveListAnchor rules): typing, clearing, a sort flip, a new clip.
// searchRefineCache: the last result, so typing more of a term tests only the
// clips that matched before (Core.search.filterRankIndexes refinement rules).
// relaxCache: the same for the empty-result nudge (Core.search.bestRelaxation).
const searchRefineCache = {};
const relaxCache = {};
function applyFilter() {
  const startedAt = performance.now();
  const firstTerm = parsedQuery().content.find(c => !c.neg && c.scope !== 'title');
  previewTerm = firstTerm ? String(firstTerm.value).trim().toLowerCase() || null : null;
  filtered = Core.filterItemIndexes(items, { query, regex: regexOn, docs: searchDocs, searchTextLower, sortMode, cache: searchRefineCache });
  const rows = filtered;
  const rowItems = items;
  clipList.update({
    ids: rows.map(ri => itemId(rowItems[ri])),
    tsAt: (i) => Number(rowItems[rows[i]] && rowItems[rows[i]].ts) || 0,
    mode: Core.search.rankMode(parsedQuery(), sortMode),
    queryKey: query,
    // Only when the list IS empty: the one filter whose removal brings clips back.
    emptyHtml: () => Core.renderEmptyState({ total: items.length, query, regex: regexOn, groups, nudgeHtml: Core.renderRelaxNudge(Core.search.bestRelaxation(searchDocs, query, { regex: regexOn, searchTextLower, cache: relaxCache })) }),
  });
  recordRendererPerf('list.apply_filter', startedAt, { rendered: renderedCount(), regex: regexOn }, 60);
}
function renderedCount() { const w = clipList.window(); return w.end - w.start; }

let rerenderFrame = null;
let rerenderTimer = null;
function rerenderList() {
  const startedAt = performance.now();
  if (rerenderFrame) { cancelAnimationFrame(rerenderFrame); rerenderFrame = null; }
  if (rerenderTimer) { clearTimeout(rerenderTimer); rerenderTimer = null; }
  renderGroupFilters();
  applyFilter();
  updateCount();
  updateSortButton(); // keeps the Best⇄Recent toggle in step with the query
  recordRendererPerf('list.rerender', startedAt, { rendered: renderedCount() }, 90);
}

// Typing never waits for the search: the rebuild runs just AFTER the next
// paint (rAF, then a task), so the typed character is on screen first and the
// list follows a frame later. Keystrokes inside that window coalesce into one
// rebuild of the latest query.
function scheduleRerenderList() {
  if (rerenderFrame || rerenderTimer) return;
  rerenderFrame = requestAnimationFrame(() => {
    rerenderFrame = null;
    rerenderTimer = setTimeout(() => { rerenderTimer = null; rerenderList(); }, 0);
  });
}

let relativeTimeTimer = null;
function scheduleRelativeTimeRefresh() {
  if (relativeTimeTimer) clearTimeout(relativeTimeTimer);
  const delay = Core.updateRelativeTimes(listEl);
  if (delay) {
    relativeTimeTimer = setTimeout(scheduleRelativeTimeRefresh, delay);
  }
}

// Where the first search term sits in clip ri's body, read from its lowercase
// haystack (no scan of the body itself); null lets the preview search instead.
let previewTerm = null;
function previewMatchIndex(ri) {
  if (!previewTerm || regexOn || !searchDocs[ri]) return null;
  return Core.search.bodyIndexOf(searchDocs[ri], searchTextLower[ri], previewTerm);
}
// A row's html (the shared list parses a whole batch of rows at once).
function buildItem(it, ri) {
  // The selection state paints a full rebuild's cursor, checked, held and
  // similar rows (it lives in the shared controller).
  return Core.renderClipItem(it, {
    imageSrc: item => `clip-img:///${esc(item.image)}`,
    query,
    regex: regexOn,
    matchIndex: previewMatchIndex(ri),
    selection: controller ? controller.selection() : null,
    actionsHtml: Core.renderClipActions(it),
  });
}

function updateCount() {
  const total = items.length;
  const visible = filtered.length;
  countEl.textContent = Core.itemCountLabel(total, visible, { query });
}

// The clear / sort / regex / options buttons slide in and out with the field's
// state (Core.attachSearchBox owns that); the app only keeps their titles.
function updateClearControls() {
  searchClear.title = Core.hasActiveFilters({ query }) ? 'Clear search and filters' : 'Clear search';
}

function clearSearchAndFilters() {
  searchEl.value = '';
  query = '';        // clears content AND facet tokens (both live in the query)
  sortMode = null;
  if (typeof searchBox !== 'undefined' && searchBox) searchBox.refresh();
  if (controller) controller.onQueryChange();
  updateClearControls();
  rerenderList();
}

window.focusSearch = function() {
  searchEl.focus();
};

// --- Shared interaction controller ---
// The app drives the SAME Core.createClipController the website demo uses; the
// adapter maps each action to the exact window.api call the app already made, so
// behavior is preserved and the dispatch can no longer drift from the demo.
// Every clip mutation sends the rev of the item this popup rendered; main
// refuses it if the clip changed since (another device, window or AI edit).
const clipRevOf = (id) => { const it = itemById(id); return it ? it.rev : undefined; };
const revGuard = (run, fallback) => Core.guardRevision(run, { toast: showToast, refresh: () => refresh({ force: true }), fallback });
const appAdapter = {
  itemById: (id) => itemById(id),
  numpadMap: () => numpadMap(),
  protectedGroups: () => new Set([aiGroupName]),
  // A chip/tag click rewrites the query TEXT (bar is source of truth). filter is a builtin
  // id (__pinned__/__images__/__numbered__) or a group name; intent is include|exclude.
  setFilterIntent: (filter, intent) => {
    const token = String(filter).startsWith('__') ? { kind: 'builtin', value: filter } : { kind: 'group', value: filter };
    query = Core.search.applyFacet(query, token, intent);
    searchEl.value = query;
    if (typeof searchBox !== 'undefined' && searchBox) searchBox.refresh();
    updateClearControls();
    if (controller) controller.onQueryChange();
  },
  clearFilters: () => clearSearchAndFilters(),
  // The empty-result nudge rewrites the whole query (one filter dropped).
  setQuery: (next) => {
    query = String(next || '');
    searchEl.value = query;
    if (typeof searchBox !== 'undefined' && searchBox) searchBox.refresh();
    updateClearControls();
    if (controller) controller.onQueryChange();
  },
  focusSearch: () => searchEl.focus(),
  closeSearchOptions: () => searchBox.closeOptions(),
  pin: (id) => revGuard(() => window.api.pin(id, clipRevOf(id)), false),
  numpadAssign: (id, slot) => revGuard(() => window.api.numpadAssign(id, slot, clipRevOf(id)), false),
  numpadUnassign: (slot) => window.api.numpadUnassign(slot),
  toggleGroup: (id, group) => revGuard(() => window.api.groupAssign(id, group, clipRevOf(id)), false), // applyGroupAssign toggles
  createGroup: async (name) => { await window.api.groupCreate(name); await refreshGroups({ render: false }); },
  deleteGroup: async (group) => {
    // Drop any group:/-group: token for the deleted group from the query.
    const p = Core.search.parseQuery(query);
    const norm = Core.search.normalizeTagName(group);
    p.groups = p.groups.filter((g) => g !== norm);
    p.negGroups = p.negGroups.filter((g) => g !== norm);
    query = Core.search.serializeQuery(p);
    searchEl.value = query;
    if (typeof searchBox !== 'undefined' && searchBox) searchBox.refresh();
    await window.api.groupDelete(group);
    await refreshGroups({ render: false });
  },
  deleteClip: (id) => revGuard(() => window.api.deleteItem(id, clipRevOf(id)), false),
  clearUnpinned: () => window.api.deleteAll(),
  setGroupSharedAi: (group) => window.api.setGroupSharedAi(group, !aiSharedGroups.has(group)),
  // Always the id-based path: window.api.copy() only takes a string, so it
  // would silently drop the clip's html/rtf. paste(id) puts every captured
  // format on the clipboard for both text and image clips.
  copyNumpadSlot: (id) => { const it = itemById(id); if (!it) return; return window.api.paste(id); },
  activateClip: (id) => window.api.pasteAndHide(id),
  editClip: (id, _itemEl, options) => window.api.openEditor(id, { ...(query ? { find: query, regex: regexOn } : {}), ...(options || {}) }),
  setClipTitle: (id, title) => revGuard(() => window.api.setClipTitle(id, title, clipRevOf(id)), false),
  openImage: (item, options) => window.api.openImage(itemId(item), options || {}),
  openImageExternal: (item) => window.api.openImageExternal(itemId(item)),
  // Image rows drag out as real files: cancel the page's own drag and let
  // main run a native file drag (temporary copies named after the clips).
  dragImages: (ids, event) => { event.preventDefault(); window.api.startDrag(ids); return true; },
  saveImage: async (item) => { const d = await window.api.copyImagePath(itemId(item)); return d && d.path ? 'Path copied' : null; },
  isSettingsOpen: () => document.getElementById('settingsView').classList.contains('show'),
  closeSettings: () => closeSettings(),
  hidePopup: () => window.api.hidePopup(),
  // --- Multi-select contract (selection state lives in the controller) ---
  visibleIds: () => clipList.ids(),
  firstVisibleId: () => clipList.firstVisibleId(),
  allItems: () => items,
  // Similar clips: a clip too big to normalise is searched through its
  // lowercase search haystack (already built for search, no second copy).
  lowerOf: (item) => searchIndexFor(item).hay,
  groupNames: () => groups,
  // The shared list renders the focused row on demand, then paints.
  renderSelection: (state, opts) => clipList.paintSelection(state, opts),
  deleteClips: (ids) => revGuard(() => window.api.deleteItems(Core.revisionTargets(ids, clipRevOf)), []), // returns restorable snapshots
  restoreClips: (snaps) => window.api.restoreItems(snaps),  // re-adds + clears tombstones
  groupAssignMany: (ids, group, shouldHave) => revGuard(() => window.api.groupAssignMany(Core.revisionTargets(ids, clipRevOf), group, shouldHave), false),
  pasteMany: (ids) => window.api.pasteMany(ids),
  startUnify: (ids) => window.api.startUnify(ids),
  offerUndo: ({ count, undo }) => Core.showActionToast(toast, {
    message: `Deleted ${count} clip${count === 1 ? '' : 's'}`,
    actionLabel: 'Undo',
    onAction: undo,
  }),
  toast: (msg) => showToast(msg),
  render: () => rerenderList(), // view-only re-render (expand/filter): no IPC
  refresh: async () => { await refresh({ force: true }); if (document.getElementById('settingsView').classList.contains('show')) openSettings(); }, // after a mutation: re-fetch history THEN re-render settings if open (await so the settings panel reads rebuilt indexes, not stale ones)
};
controller = Core.createClipController(appAdapter);
const appDialogs = controller.dialogs;
const clipList = Core.createClipList({
  listEl,
  newestEl: document.getElementById('listNewest'),
  barEl: document.getElementById('selectionBar'),
  renderRow: (i) => buildItem(items[filtered[i]], filtered[i]),
  controller,
  onRendered: () => scheduleRelativeTimeRefresh(),
});
// Image preview height: Ctrl+wheel / Ctrl+=/-/0 (routed by the controller) and
// the Settings row; saved per machine.
const imageZoom = Core.createImageZoom({
  root: document.documentElement,
  clipList,
  save: (px) => window.api.saveSettings({ image_preview_height: px }),
  toast: (msg) => showToast(msg),
});
appAdapter.imageZoom = imageZoom;
if (window.api.onImageZoomKey) window.api.onImageZoomKey((act) => imageZoom.applyKey(act));

document.addEventListener('click', (e) => controller.onClick(e));
document.addEventListener('mousedown', (e) => controller.onMousedown(e));
document.addEventListener('mouseup', (e) => controller.onMouseup(e));
document.addEventListener('auxclick', (e) => controller.onAuxclick(e));
document.addEventListener('contextmenu', (e) => controller.onContextmenu(e));
document.addEventListener('wheel', (e) => controller.onWheel(e), { passive: false });
document.addEventListener('dragstart', (e) => controller.onDragstart(e));
document.addEventListener('mouseover', (e) => controller.onMouseover(e));
document.addEventListener('mouseout', (e) => controller.onMouseout(e));

// Popup reset (called by the main process when the window is shown).
window.resetPopupState = function() {
  appDialogs.dismiss();
  controller.closeMenu(); // a popover left open at blur-hide would eat keys on re-show
  controller.clearSelection({ paint: false });
  controller.forgetPointer(); // no stale similar-clip tint from the last hover
  clipList.scrollToTop(); // reopening always starts at the newest clip
  document.getElementById('settingsView')?.classList.remove('show');
  document.getElementById('mainView')?.classList.remove('hidden');
  document.body.style.pointerEvents = '';
  searchBox.closeOptions({ instant: true }); // every open starts with the options panel shut
  window.focusSearch();
};

// Global numpad hotkey from the main process: assign the focused row's clip
// (inherits the shared replace-confirm via the controller).
window.assignNumpad = function(slot) {
  const id = controller.focusedId();
  if (id) controller.tryAssignNumpad(id, slot);
};

// Settings: the Appearance controls + the body's scroll fade, shared with the
// demo. Writes go through save-settings (validated in main, then broadcast
// back to every window as appearance-changed); a dragged hue previews here.
settingsUi = Core.mountSettings(document.getElementById('settingsView'), {
  save: (body) => window.api.saveSettings(body),
  preview: (look) => Core.applyAppearance(document.documentElement, { ...currentLook, ...look }),
});
// Clear all (Settings)
document.getElementById('clearAll').addEventListener('click', () => controller.clearAll());
document.getElementById('copyDiagnostics').addEventListener('click', async () => {
  const diagnostics = await window.api.getSyncDiagnostics();
  await window.api.copy(JSON.stringify(diagnostics, null, 2));
  showToast('Diagnostics copied');
});

// --- Search ---
searchEl.addEventListener('keydown', e => {
  if (searchEl.value === '' && e.key >= '1' && e.key <= '9') {
    const n = +e.key;
    const nmap = numpadMap();
    if (n in nmap) {
      e.preventDefault();
      window.api.numpadPasteAndHide(n);
      return;
    }
  }
});
const searchClear = document.getElementById('searchClear');
// Shared query-state change path (typed input AND autocomplete-applied tokens).
function onQueryChanged(v) {
  query = v;
  if (controller) controller.onQueryChange();
  updateClearControls();
  updateSortButton();
  scheduleRerenderList();
}
// Live syntax highlighting + autocomplete (shared helper). It decorates the input; the
// input's own listeners below still own query state + rerender.
const searchBox = Core.attachSearchBox(searchEl, {
  getRegex: () => regexOn,
  getGroups: () => groups,
  getCensus: (parsed) => censusCache.get(parsed),
  onChange: onQueryChanged,
  // The options panel's height: per machine (dragged on its bottom edge).

function manualSyncResultText(result) {
  const ms = result && typeof result.ms === 'number' ? result.ms : 0;
  const elapsed = ms >= 1000 ? `${(ms / 1000).toFixed(1)}s` : `${ms}ms`;
  const changed = result && result.local_changed ? 'updated local' : result && result.wrote_remotes ? 'wrote cloud' : 'up to date';
  return `Synced: ${changed} (${elapsed})`;
}

// The switch shows on / off; the help line says only what it adds (the peers
// are listed as rows under it).
function p2pStatusText(status) {
  if (!status || !status.enabled) return '';
  if (!status.running) return 'Starting...';
  const peers = Array.isArray(status.peers) ? status.peers : [];
  return peers.length ? `${peers.length} device${peers.length === 1 ? '' : 's'} nearby` : 'Looking for nearby BoardClip devices';
}

function renderP2PStatus(status) {
  Core.setSettingHelp(document.getElementById('p2pStatus'), p2pStatusText(status), status && status.enabled && status.running ? 'active' : '');
  renderP2PPeers(status);
}

function agoText(at) {
  if (!at) return 'never';
  const s = Math.max(0, Math.round((Date.now() - at) / 1000));
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  return `${Math.round(s / 3600)}h ago`;
}

// Per-peer rows (name, transport, address, last exchange, build) + the tailnet
// line, so "is the Mac paired, and over what?" is visible without a log.
function renderP2PPeers(status) {
  const list = document.getElementById('p2pPeers');
  if (!list) return;
  const peers = status && Array.isArray(status.peers) ? status.peers : [];
  list.innerHTML = peers.map((peer) => Core.renderSettingsItem({
    title: peer.deviceName || 'Device',
    meta: `${peer.transport === 'tailnet' ? 'Tailscale' : 'LAN'}${(peer.protocol || 1) >= 2 ? '' : ', older build (full-state sync)'}`,
    sub: `${peer.host}:${peer.port} \u00b7 seen ${agoText(peer.lastSeen)}${peer.build ? ' \u00b7 ' + peer.build : ''}`,
    subMono: true,
  })).join('');
  const tail = document.getElementById('p2pTailnet');
  if (tail) {
    const tailnet = status && status.tailnet;
    if (!status || !status.enabled) tail.textContent = '';
    else if (tailnet && tailnet.available) {
      const online = (tailnet.peers || []).filter(node => node.online);
      tail.textContent = `Tailscale: ${online.length} other device${online.length === 1 ? '' : 's'} online${online.length ? ' (' + online.slice(0, 3).map(node => node.name).join(', ') + ')' : ''}`;
    } else tail.textContent = 'Tailscale CLI not found: LAN, synced addresses and pinned peers only';
  }
}

// Live coarse progress for long syncs (first sync after a pause can hydrate
// thousands of cloud files). Provider-level only — calm, no per-file spam.
function syncProviderLabel(p) {
  const s = String(p || '');
  if (/OneDrive/i.test(s)) return 'OneDrive';
  if (/CloudDocs|iCloud/i.test(s)) return 'iCloud';
  if (/GoogleDrive|My Drive|\\My Drive|Drive/i.test(s)) return 'Google Drive';
  return 'cloud folder';
}

window.api.onSyncProgress && window.api.onSyncProgress((p) => {
  const buttons = [document.getElementById('syncHeaderBtn'), document.getElementById('syncNow')].filter(Boolean);
  const syncStatus = document.getElementById('syncStatus');
  const setText = (text, spinning) => {
    for (const button of buttons) {
      button.title = text;
      button.setAttribute('aria-label', text);
      button.classList.toggle('syncing', !!spinning);
    }
    if (syncStatus && syncStatus.classList.contains('active')) syncStatus.textContent = text;
  };
  if (p.phase === 'start') setText('Syncing\u2026', true);
  else if (p.phase === 'read') setText(`Syncing ${p.index}/${p.total} \u2014 ${syncProviderLabel(p.path)}\u2026`, true);
  else if (p.phase === 'write') setText('Syncing \u2014 writing cloud\u2026', true);
  else if (p.phase === 'done') setText(p.ok ? 'Sync now' : 'Sync failed \u2014 retry', false);
});

async function runManualSync({ showSettingsStatus = false } = {}) {
  if (manualSyncInFlight) return;
  manualSyncInFlight = true;
  setManualSyncButtons(true);
  const syncStatus = document.getElementById('syncStatus');
  if (showSettingsStatus && syncStatus) {
    Core.setSettingHelp(syncStatus, 'Syncing...', 'active');
  }
  try {
    const result = await window.api.syncNow();
    await refresh();
    const statusText = manualSyncResultText(result);
    if (showSettingsStatus && syncStatus) {
      Core.setSettingHelp(syncStatus, statusText, 'active');
      setTimeout(() => openSettings(), 500);
    } else {
      showToast(statusText);
    }
  } catch (error) {
    if (showSettingsStatus && syncStatus) {
      Core.setSettingHelp(syncStatus, 'Sync failed', 'error');
    } else {
      showToast('Sync failed');
    }
  } finally {
    manualSyncInFlight = false;
    setManualSyncButtons(false);
  }
}

function shortcutLabel(accelerator) {

}

function stopShortcutRecording({ resume = true } = {}) {

    if (button) button.classList.remove('recording');

function renderShortcutSettings(settings, { clearStatus = true } = {}) {
  const info = settings.shortcut_info || { show: 'CommandOrControl+Shift+V', custom: false };
  const record = shortcutRecordEl('show');
  const reset = shortcutResetEl('show');
  record.textContent = shortcutLabel(info.show);
  record.title = info.show;
  record.classList.remove('recording');
  reset.style.visibility = info.custom ? 'visible' : 'hidden';
  const quickRecord = shortcutRecordEl('quickPaste');
  const quickReset = shortcutResetEl('quickPaste');
  const quickShortcut = info.quickPaste || '';
  if (quickShortcut) {
    quickRecord.textContent = `${shortcutLabel(quickShortcut).replace(/\s\+\s[1-9]$/, '')} + 1-9`;
    quickRecord.title = `${quickShortcut.replace(/[1-9]$/, '1')} ... ${quickShortcut.replace(/[1-9]$/, '9')}`;
  } else {
    quickRecord.textContent = 'Not set';
    quickRecord.title = 'Record quick paste shortcut';
  }
  quickRecord.classList.toggle('unset', !quickShortcut);
  quickRecord.classList.remove('recording');
  quickReset.style.visibility = info.quickPasteCustom ? 'visible' : 'hidden';
  if (clearStatus) {
    setShortcutStatus('show', '');
    setShortcutStatus('quickPaste', '');
  }
}

function shortcutKeyFromEvent(e) {
  const modifierKeys = new Set(['Alt', 'AltGraph', 'Control', 'Meta', 'Shift']);
  if (modifierKeys.has(e.key)) return '';
  if (/^Key[A-Z]$/.test(e.code)) return e.code.slice(3);
  if (/^Digit[0-9]$/.test(e.code)) return e.code.slice(5);
  if (/^Numpad[0-9]$/.test(e.code)) return `num${e.code.slice(6)}`;
  if (/^F([1-9]|1[0-9]|2[0-4])$/.test(e.key)) return e.key.toUpperCase();
  const byCode = {
    Minus: 'Minus',
    Equal: e.shiftKey ? 'Plus' : '=',
    BracketLeft: '[',
    BracketRight: ']',
    Backslash: 'Backslash',
    Semicolon: ';',
    Quote: "'",
    Backquote: '`',
    Comma: ',',
    Period: '.',
    Slash: '/',
    NumpadAdd: 'Plus',
    NumpadSubtract: 'Minus',
    NumpadMultiply: '*',
    NumpadDivide: '/',
    NumpadDecimal: '.',
  };
  if (byCode[e.code]) return byCode[e.code];
  const byKey = {
    ' ': 'Space',
    Spacebar: 'Space',
    Tab: 'Tab',
    Enter: 'Enter',
    Return: 'Enter',
    Backspace: 'Backspace',
    Delete: 'Delete',
    Insert: 'Insert',
    Home: 'Home',
    End: 'End',
    PageUp: 'PageUp',
    PageDown: 'PageDown',
    ArrowUp: 'Up',
    ArrowDown: 'Down',
    ArrowLeft: 'Left',
    ArrowRight: 'Right',
    CapsLock: 'Capslock',
    NumLock: 'Numlock',
    ScrollLock: 'Scrolllock',
    '+': 'Plus',
    '-': 'Minus',
  };
  return byKey[e.key] || '';
}

function shortcutFromEvent(e) {
  const mods = [];
  if (e.metaKey) mods.push(window.api.platform === 'darwin' ? 'Command' : 'Super');
  if (e.ctrlKey) mods.push('Control');
  if (e.altKey) mods.push('Alt');
  if (e.shiftKey) mods.push('Shift');
  const key = shortcutKeyFromEvent(e);
  if (!key || !mods.length) return '';
  return [...mods, key].join('+');
}

async function applyShortcut(kind, shortcut) {
  stopShortcutRecording({ resume: false });
  const result = kind === 'quickPaste'
    ? await window.api.setQuickPasteShortcut(shortcut)
    : await window.api.setShowShortcut(shortcut);
  if (!result || !result.ok) {
    const settings = await window.api.getSettings().catch(() => null);
    if (settings) renderShortcutSettings(settings, { clearStatus: false });
    setShortcutStatus(kind, result && result.error ? result.error : 'Shortcut was not saved.', true);
    return;
  }
  const settings = await window.api.getSettings();
  renderShortcutSettings(settings);
}

async function startShortcutRecording(kind) {
  stopShortcutRecording();
  if (window.api.suspendShortcuts) {
    await window.api.suspendShortcuts().catch(() => {});
  }
  shortcutRecording = kind;
  const record = shortcutRecordEl(kind);
  record.classList.add('recording');
  record.textContent = 'Press keys';
  setShortcutStatus(kind, '');
}

document.addEventListener('keydown', async (e) => {
  if (!shortcutRecording) return;
  const kind = shortcutRecording;
  e.preventDefault();
  e.stopPropagation();
  if (e.key === 'Escape') {
    stopShortcutRecording();
    const settings = await window.api.getSettings().catch(() => null);
    if (settings) renderShortcutSettings(settings);
    return;
  }
  const shortcut = shortcutFromEvent(e);
  if (!shortcut) {
    setShortcutStatus(kind, shortcutKeyFromEvent(e) ? 'Add a shortcut modifier.' : 'Press a non-modifier key.', true);
    return;
  }
  const resolved = kind === 'show' && window.api.resolveShowShortcut
    ? await window.api.resolveShowShortcut(shortcut)
    : shortcut;
  await applyShortcut(kind, resolved);
}, true);

function shortCommit(sha) {
  return sha ? String(sha).slice(0, 7) : '';
}

function updateUnavailableText(reason) {
  switch (reason) {
    case 'dirty-checkout':
      return 'Source checkout has local changes; run the public update command';
    case 'not-git-checkout':
      return 'Packaged build; source auto-update unavailable';
    case 'missing-update-script':
      return 'Source update script missing';
    case 'unknown-build':
      return 'Build commit unknown';
    default:
      return 'Source auto-update unavailable';
  }
}

function updateStatusText(result) {
  const latest = shortCommit(result && result.latest);
  switch (result && result.status) {
    case 'current':
      return 'Up to date';
    case 'updating':
      return latest ? `Updating to ${latest}...` : 'Updating...';
    case 'reloaded':
      return latest ? `Updated UI to ${latest}` : 'Updated UI';
    case 'relaunching':
      return latest ? `Updated to ${latest}; relaunching...` : 'Updated; relaunching...';
    case 'unsupported':
      return updateUnavailableText(result && result.reason);
    case 'busy':
      return 'Update check already running';
    case 'error':
      return result.error ? `Update check failed: ${result.error}` : 'Update check failed';
    default:
      return 'Could not determine latest version';
  }
}

function setUpdateStatus(message, state = '') {
  Core.setSettingHelp(document.getElementById('updateStatus'), message, state);
}

function renderUpdateSettings(settings) {
  const support = settings.runtime_info && settings.runtime_info.update_support || {};
  const supported = !!(settings.runtime_info && settings.runtime_info.auto_update);
  const updateBuild = document.getElementById('updateBuild');
  const updateDetail = document.getElementById('updateDetail');
  const updateNow = document.getElementById('updateNow');
  const label = settings.build_info && settings.build_info.label ? settings.build_info.label : 'unknown';
  updateBuild.textContent = `Build ${label}`;
  updateDetail.textContent = supported
    ? 'Updates itself from Git at startup and every 4 h'
    : updateUnavailableText(support.reason);
  updateNow.disabled = !supported;
  // Developer checkouts: the update mode, one more settings row under the build.
  const updatesRow = updateBuild.closest('.setting-row');
  let modeHost = document.getElementById('developerUpdateMode');
  const rt = settings.runtime_info || {};
  const visible = !!rt.update_mode_visible;
  if (visible && !modeHost && updatesRow) {
    modeHost = document.createElement('div');
    modeHost.id = 'developerUpdateMode';
    modeHost.className = 'setting-row';
    updatesRow.after(modeHost);
  }
  if (modeHost) {
    modeHost.classList.toggle('hidden', !visible);
    modeHost.innerHTML = visible ? `
      <span class="setting-text"><span class="setting-label">Update mode</span>
        <span class="setting-help">${rt.update_mode === 'development' ? 'Dirty source checkouts update with autostash' : 'Local tracked edits block updates'}</span></span>
      <span class="setting-control"><span class="seg" role="group" aria-label="Update mode">
        <button type="button" class="seg-btn${rt.update_mode === 'production' ? ' active' : ''}" data-update-mode="production">Production</button>
        <button type="button" class="seg-btn${rt.update_mode === 'development' ? ' active' : ''}" data-update-mode="development">Development</button>
      </span></span>` : '';
    modeHost.querySelectorAll('[data-update-mode]').forEach(button => {
      button.onclick = async () => {
        await window.api.setUpdateMode(button.dataset.updateMode);
        openSettings();
      };
    });
  }
  setUpdateStatus('', '');
}

document.getElementById('updateNow').addEventListener('click', async () => {
  const updateNow = document.getElementById('updateNow');
  updateNow.disabled = true;
  setUpdateStatus('Checking...', 'active');
  try {
    const result = await window.api.checkForUpdates();
    const state = result.ok || result.status === 'busy' ? 'active' : 'error';
    setUpdateStatus(updateStatusText(result), state);
    if (result.status !== 'updating') updateNow.disabled = false;
  } catch (error) {
    setUpdateStatus(`Update check failed: ${error && error.message ? error.message : 'unknown error'}`, 'error');
    updateNow.disabled = false;
  }
});

async function openSettings() {
  const s = await window.api.getSettings();
  const rt = s.runtime_info || {};
  const autoLaunchEl = document.getElementById('autoLaunch');
  autoLaunchEl.checked = await window.api.getAutoLaunch();
  autoLaunchEl.onchange = (e) => window.api.setAutoLaunch(e.target.checked);
  setThemeMode(s.theme_mode || themeMode);
  document.getElementById('themeMode').onclick = (e) => {
    const btn = e.target.closest('[data-theme-mode]');
    if (!btn) return;
    setThemeMode(btn.dataset.themeMode);
    window.api.saveSettings({ theme_mode: btn.dataset.themeMode });
  };
  if (rt.appearance) currentLook = { ...currentLook, ...rt.appearance };
  settingsUi.update({ ...appearanceControlsState(currentLook), surfaceStyle: s.surface_style || 'auto', glassSupported: rt.surface_supported !== false });
  renderAppearanceVariants(s);
  renderShortcutSettings(s);
  const maxAgeEl = document.getElementById('maxAge');
  const maxSizeEl = document.getElementById('maxSize');
  imageZoom.bindInput(document.getElementById('imagePreviewHeight'), document.getElementById('imagePreviewHeightReset'));
  maxAgeEl.value = s.max_age_days;
  maxSizeEl.value = s.max_size_gb;
  maxAgeEl.onchange = () => window.api.saveSettings({ max_age_days: parseInt(maxAgeEl.value) || 7 });
  maxSizeEl.onchange = () => window.api.saveSettings({ max_size_gb: parseFloat(maxSizeEl.value) || 10 });
  const restoreEl = document.getElementById('quickPasteRestore');
  restoreEl.checked = s.quick_paste_restore !== false;
  restoreEl.onchange = () => window.api.saveSettings({ quick_paste_restore: restoreEl.checked });
  const diagnosticsEl = document.getElementById('diagnosticsEnabled');
  const diagnosticsStatus = document.getElementById('diagnosticsStatus');
  const diagnosticsFile = rt.diagnostics_file || '';
  const updateDiagnosticsStatus = () => {
    Core.setSettingHelp(diagnosticsStatus, diagnosticsEnabled ? 'Writing performance log' : '', diagnosticsEnabled ? 'active' : '');
    diagnosticsStatus.title = diagnosticsEnabled ? diagnosticsFile : '';
  };
  diagnosticsEnabled = !!s.diagnostics_enabled;
  diagnosticsEl.checked = diagnosticsEnabled;
  updateDiagnosticsStatus();
  diagnosticsEl.onchange = async (e) => {
    diagnosticsEnabled = !!e.target.checked;
    await window.api.saveSettings({ diagnostics_enabled: diagnosticsEnabled });
    updateDiagnosticsStatus();
  };
  regexOn = s.regex_search || false;
  regexBtn.classList.toggle('active', regexOn);
  searchBox.refresh();
  const mb = ((s.storage_bytes || 0) / 1048576).toFixed(1);
  Core.setSettingHelp(document.getElementById('usage'), `${s.item_count} clip${s.item_count === 1 ? '' : 's'}, ${mb} MB used`);

  // Native cloud providers are default-on; the switches are local opt-outs.
  const syncList = document.getElementById('syncAccounts');
  const accounts = await window.api.getCloudAccounts();
  syncList.innerHTML = accounts.map((acc) => Core.renderSettingsItem({
    title: syncAccountLabel(acc), sub: acc.path, subMono: true,
    toggle: { checked: !!acc.enabled, label: `Sync with ${syncAccountLabel(acc)}`, attrs: { 'data-sync-path': acc.path } },
  })).join('');
  const enabledAccounts = accounts.filter(acc => acc.enabled);
  Core.setSettingHelp(document.getElementById('syncStatus'), accounts.length
    ? `${enabledAccounts.length} of ${accounts.length} on, syncs on every change and every 30 s`
    : 'No cloud folders found', enabledAccounts.length ? 'active' : '');
  const p2pEnabledEl = document.getElementById('p2pEnabled');
  const p2pRuntime = rt.p2p || { enabled: !!s.p2p_enabled };
  p2pEnabledEl.checked = !!p2pRuntime.enabled;
  renderP2PStatus(p2pRuntime);
  p2pEnabledEl.onchange = async (event) => {
    const nextEnabled = !!event.target.checked;
    renderP2PStatus({ enabled: nextEnabled, running: false, peers: [] });
    const status = await window.api.setP2PEnabled(nextEnabled);
    renderP2PStatus(status);
  };
  const pinnedEl = document.getElementById('p2pPinned');
  if (pinnedEl) {
    pinnedEl.value = (Array.isArray(s.p2p_pinned_peers) ? s.p2p_pinned_peers : []).join(', ');
    pinnedEl.onchange = async () => {
      const pins = pinnedEl.value.split(/[,\s]+/).map(v => v.trim()).filter(Boolean);
      await window.api.saveSettings({ p2p_pinned_peers: pins });
      renderP2PStatus(await window.api.getP2PStatus());
    };
  }
  startP2PStatusRefresh();
  renderUpdateSettings(s);
  const buildInfoEl = document.getElementById('buildInfo');
  buildInfoEl.textContent = rt.app_dir || '';
  buildInfoEl.title = rt.app_dir || '';

  // Numpad slots: the assigned ones (.np-remove unassigns, a row click copies:
  // the shared controller's settings dispatch).
  const nmap = numpadMap();
  document.getElementById('numpadSlots').innerHTML = Core.renderNumpadSlotRows(nmap, itemById);
  document.getElementById('numpadHelp').classList.toggle('hidden', Object.keys(nmap).length >= 9);

  // AI Access (renders before groups so the shared-group set is ready)
  await renderAiAccess();
  await renderConflicts();

  // Groups (.gp-share toggles AI sharing, .gp-del deletes with the shared
  // confirm: the shared controller's settings dispatch).
  document.getElementById('groupSlots').innerHTML = Core.renderGroupRows(groups, { counts: groupCounts, shared: aiSharedGroups, aiGroup: aiGroupName });

  document.getElementById('mainView').classList.add('hidden');
  document.getElementById('settingsView').classList.add('show');
}

async function renderConflicts() {
  const section = document.getElementById('conflictsSection');
  const wrap = document.getElementById('conflictSlots');
  if (!section || !wrap || !window.api.getConflicts) return;
  const conflicts = await window.api.getConflicts().catch(() => []);
  section.classList.toggle('hidden', !conflicts.length);
  const short = (side) => Core.titleOf(side) || (side && side.text || '').replace(/\s+/g, ' ').trim().slice(0, 44);
  wrap.innerHTML = conflicts.map((conflict) => {
    const kind = String(conflict.kind || 'merge');
    return Core.renderSettingsItem({
      title: `${kind.charAt(0).toUpperCase()}${kind.slice(1)} conflict`,
      sub: `${short(conflict.left) || 'Current'} ↔ ${short(conflict.right) || 'Incoming'}`,
      controlHtml: `<button class="btn" type="button" data-conflict-id="${esc(conflict.id)}">Resolve</button>`,
    });
  }).join('');
  wrap.onclick = (event) => {
    const btn = event.target.closest('[data-conflict-id]');
    if (!btn) return;
    window.api.openConflict(btn.dataset.conflictId);
  };
}

function closeSettings() {
  document.getElementById('settingsView').classList.remove('show');
  document.getElementById('mainView').classList.remove('hidden');
  searchEl.focus();
}

// --- AI Access (MCP) ---
let aiSharedGroups = new Set();
let aiGroupName = 'AI';

async function renderAiAccess() {
  const st = await window.api.getAiAccess().catch(() => null);
  if (!st) return;
  applyAiAccess(st);
  document.getElementById('aiAccessEnabled').onchange = async (e) => {
    Core.setSettingHelp(document.getElementById('aiAccessStatus'), e.target.checked ? 'Starting...' : 'Turning off...');
    const next = await window.api.setAiAccessEnabled(e.target.checked).catch(() => null);
    if (next) { await refreshGroupsAndList(); openSettings(); }
  };
  document.getElementById('aiTimeout').onchange = async (e) => {
    const next = await window.api.setAiApprovalTimeout(parseInt(e.target.value) || 60).catch(() => null);
    if (next) applyAiAccess(next);
  };
  document.getElementById('aiMoreClients').onclick = () => {
    document.getElementById('aiClientsMore').classList.toggle('hidden');
    renderAiMoreLabel();
  };
  // Install / remove BoardClip in one client: one delegated listener per list.
  for (const id of ['aiClients', 'aiClientsMore']) {
    document.getElementById(id).onchange = async (e) => {
      const input = e.target.closest('[data-ai-client]');
      if (!input) return;
      const next = await window.api.setMcpClientEnabled(input.dataset.aiClient, input.checked).catch(() => null);
      if (next) applyAiAccess(next);
    };
  }
  document.getElementById('aiAlwaysAllow').onclick = async (e) => {
    const btn = e.target.closest('[data-revoke]');
    if (!btn) return;
    const next = await window.api.revokeAiAlwaysAllow(btn.dataset.revoke).catch(() => null);
    if (next) applyAiAccess(next);
  };
}

// The switch shows on / off; the help says what it does while off and how it
// is doing while on.
function applyAiAccess(st) {
  aiSharedGroups = new Set(st.sharedGroups || []);
  aiGroupName = st.aiGroup || 'AI';
  document.getElementById('aiAccessEnabled').checked = !!st.enabled;
  document.getElementById('aiAccessBody').classList.toggle('hidden', !st.enabled);
  Core.setSettingHelp(document.getElementById('aiAccessStatus'),
    !st.enabled ? 'Reads clips in shared groups; deletes and edits ask you first' : st.running ? 'Running, assistants can connect' : 'Starting...',
    st.enabled && st.running ? 'active' : '');
  document.getElementById('aiTimeout').value = st.timeoutSec;
  renderAiClients(st);
  renderAiAlwaysAllow(st);
}

function aiClientRowHtml(c) {
  return Core.renderSettingsItem({
    title: c.label, dim: !c.detected, sub: c.detected ? '' : 'Not detected on this machine',
    toggle: { checked: !!c.enabled, label: `${c.enabled ? 'Remove BoardClip from' : 'Install BoardClip in'} ${c.label}`, attrs: { 'data-ai-client': c.id } },
  });
}

function renderAiMoreLabel() {
  const more = document.getElementById('aiClientsMore');
  const btn = document.getElementById('aiMoreClients');
  btn.textContent = more.classList.contains('hidden') ? `Show all clients (${more.children.length} more)` : 'Show fewer clients';
}

function renderAiClients(st) {
  const clients = st.clients || [];
  const detected = clients.filter(c => c.detected);
  const undetected = clients.filter(c => !c.detected);
  document.getElementById('aiClients').innerHTML = detected.length
    ? detected.map(aiClientRowHtml).join('')
    : Core.renderSettingsItem({ title: 'No AI clients found on this machine', dim: true });
  const moreWrap = document.getElementById('aiClientsMore');
  moreWrap.innerHTML = undetected.map(aiClientRowHtml).join('');
  if (!undetected.length) moreWrap.classList.add('hidden');
  document.getElementById('aiMoreClients').classList.toggle('hidden', !undetected.length);
  renderAiMoreLabel();
}

function renderAiAlwaysAllow(st) {
  const grants = st.alwaysAllow || [];
  document.getElementById('aiAlwaysHead').classList.toggle('hidden', !grants.length);
  document.getElementById('aiAlwaysAllow').innerHTML = grants.map((tool) => Core.renderSettingsItem({
    title: tool, titleMono: true,
    actionHtml: `<button class="icon-btn" type="button" data-revoke="${esc(tool)}" title="Revoke: ask again next time" aria-label="Revoke ${esc(tool)}"><span class="mi">close</span></button>`,
  })).join('');
}

if (window.api && window.api.onAiAccessChanged) {
  window.api.onAiAccessChanged(() => {
    if (document.getElementById('settingsView').classList.contains('show')) renderAiAccess();
  });
}


// --- Groups refresh ---
async function refreshGroups({render = true} = {}) {
  const startedAt = performance.now();
  try {
    const s = await window.api.getSettings();
    groups = s.groups || [];
    diagnosticsEnabled = !!s.diagnostics_enabled;
    if (render) renderGroupFilters();
    recordRendererPerf('settings.refresh_groups', startedAt, { groups: groups.length, render }, 75);
  } catch {}
}

// Refreshes coalesce: a burst of history-changed events plus the show/focus
// refresh used to stack five full refreshes (~7s of renderer work after three
// quick captures, measured 2026-09-02). Now ONE runs and at most ONE more is
// queued behind it, carrying the strongest `force`.
let refreshInFlight = null;
let refreshQueued = null;
function refreshGroupsAndList({force = true} = {}) {
  if (refreshInFlight) {
    refreshQueued = { force: !!(refreshQueued && refreshQueued.force) || force };
    return refreshInFlight;
  }
  refreshInFlight = (async () => {
    try {
      await refreshGroups({render: false});
      await refresh({force});
    } finally {
      refreshInFlight = null;
      if (refreshQueued) {
        const next = refreshQueued;
        refreshQueued = null;
        refreshGroupsAndList(next);
      }
    }
  })();
  return refreshInFlight;
}

// --- Data refresh ---
// History fetches run one at a time, each from the revision the previous one
// left: two overlapping fetches carried the same revision, so the second could
// only be answered with a FULL snapshot (~1 s on the popup thread) instead of a
// delta. Every caller (coalesced refreshes, post-mutation, manual sync) queues.
let refreshChain = Promise.resolve();
function refresh(options) {
  const run = refreshChain.then(() => refreshNow(options));
  refreshChain = run.catch(() => {});
  return run;
}
async function refreshNow({force = false} = {}) {
  const startedAt = performance.now();
  try {
    // Hand main the revision we already hold: unchanged history comes back as a
    // revision-only reply, not a ~10k-item clone.
    const state = window.api.getHistoryState ? await window.api.getHistoryState(dataRevision) : {revision: Date.now(), items: await window.api.getHistory()};
    const changed = !state.unchanged && state.revision !== dataRevision;
    if (changed) {
      // A delta (only the changed clips + the order) once we hold a snapshot.
      items = Core.applyHistoryDelta(items, state);
      dataRevision = state.revision;
      rebuildItemIndexes();
    }
    if (changed || force) rerenderList();
    recordRendererPerf('history.refresh', startedAt, { changed, force, revision: state.revision, delta: !!state.delta, sent_items: state.items ? state.items.length : 0 }, 100);
  } catch {}
}

// Initial load + poll
refreshGroupsAndList();
if (window.api.onHistoryChanged) {
  window.api.onHistoryChanged(() => refreshGroupsAndList());
} else {
  setInterval(refresh, 1000);
}

// --- Focus/blur integration ---
window.addEventListener('focus', () => {
  // Not forced: an unchanged history needs no rebuild (it cost ~60 ms on every
  // popup show, right when typing starts).
  refreshGroupsAndList({ force: false });
  setTimeout(() => searchEl.focus(), 50);
});
window.addEventListener('blur', () => {
  // Popup auto-hides via Electron's blur handler on the BrowserWindow
});
</script></body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Approve AI action</title>
<script>
  document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
</script>
<link rel="stylesheet" href="site/shared/clipboard-popup.css">
<link rel="stylesheet" href="site/shared/clipboard-window.css">
<!-- The shared core: its applyTheme / applyAppearance render the appearance
     payload exactly as every other window does. -->
<script src="site/shared/clip-search.js"></script>
<script src="site/shared/clipboard-ui-core.js"></script>
<style>
  /* Tokens, the .mi icon spec, the .overline label, the .btn set, the focus
     ring and the scrollbar come from the shared clipboard-popup.css; the
     window base (reset, font, glass scrim) from clipboard-window.css, so the
     modal can never drift from the app. Only the modal's own layout lives here.
     Layout answers, top to bottom: WHO is asking, WHAT happens (title + one
     plain sentence with the consequence), WHY it is asking, WHICH clip (facts),
     the text only as a labelled preview, then the decision: [Deny] [Allow
     once], with "for this session" / "always" as quiet options above it. */
  body { user-select:none; }
  /* The bar is the shared window bar (.bc-bar: drag region, --bar-h, the title in sentence case). */
  .wrap { padding:var(--sp-5) var(--gutter) var(--sp-6); display:flex; flex-direction:column; gap:var(--sp-4); }
  .who { font-size:var(--fs-meta); line-height:var(--lh-ui); color:var(--text-dim); }
  .who b { color:var(--text); font-weight:var(--fw-strong); }
  .head { display:flex; gap:var(--sp-5); align-items:center; }
  .badge { width:var(--ctl-lg); height:var(--ctl-lg); border-radius:var(--r-panel); flex-shrink:0; display:flex; align-items:center; justify-content:center;
           background:var(--accent-bg); color:var(--accent); }
  .badge.danger { background:var(--red-bg); color:var(--red); }
  h1 { font-size:var(--fs-ui); font-weight:var(--fw-strong); line-height:var(--lh-ui); }
  .explain { font-size:var(--fs-ui); line-height:var(--lh-text); color:var(--text); }
  .why { font-size:var(--fs-meta); line-height:var(--lh-ui); color:var(--text-dim); display:flex; gap:var(--sp-2); align-items:flex-start; }
  .why .mi { flex-shrink:0; }
  .facts { display:grid; grid-template-columns:auto 1fr; gap:var(--sp-1) var(--sp-4); font-size:var(--fs-meta); }
  .facts dt { color:var(--text-dim); }
  .facts dd { color:var(--text); word-break:break-word; }
  .card { background:var(--bg); border-radius:var(--r-panel); padding:var(--sp-4) var(--sp-5); }
  .card .overline { margin-bottom:var(--sp-2); }
  .detail { font-family:var(--font-mono); font-size:var(--fs-ui); line-height:var(--lh-text); color:var(--text);
            white-space:pre-wrap; word-break:break-word; max-height:88px; overflow:auto; }
  /* The countdown is information, not a warning: neutral, whatever the action. */
  .meter { height:3px; border-radius:var(--r-chip); background:var(--line); overflow:hidden; }
  .meter > span { display:block; height:100%; width:100%; background:var(--text-dim); transition:width 1s linear; }
  .meter.paused > span { opacity:.45; }
  .countdown { font-size:var(--fs-meta); color:var(--text-dim); display:flex; justify-content:space-between; margin-top:var(--sp-3); }
  .later { display:flex; flex-wrap:wrap; gap:var(--sp-2); margin:0 calc(-1 * var(--sp-3)); }
  .acts { display:flex; justify-content:flex-end; gap:var(--sp-4); }
</style></head>
<body>
  <div class="bc-bar"><span class="bc-bar-title">AI action</span></div>
  <div class="wrap" id="wrap">
    <div class="who" id="who" title="Asked through BoardClip's AI access (its MCP connection). You can turn AI access off in Settings."><b id="client">An AI assistant</b> wants BoardClip to:</div>
    <div class="head">
      <div class="badge" id="badge"><span class="mi lg" id="badgeIcon">smart_toy</span></div>
      <h1 id="title">Act on your clips</h1>
    </div>
    <div class="explain" id="explain"></div>
    <div class="why" id="whyRow"><span class="mi sm">info</span><span id="why"></span></div>
    <dl class="facts" id="facts"></dl>
    <div class="card" id="detailCard">
      <div class="label overline" id="detailLabel">Clip text</div>
      <div class="detail" id="detail"></div>
    </div>
    <div>
      <div class="meter" id="meter"><span id="meterBar"></span></div>
      <div class="countdown"><span id="countLabel">Denies automatically if you don't respond</span><span id="countNum"></span></div>
    </div>
    <div class="later">
      <button type="button" class="btn quiet sm" id="allowSession" data-allow>Allow for this session</button>
      <button type="button" class="btn quiet sm" id="allowAlways" data-allow>Always allow</button>
    </div>
    <div class="acts">
      <button type="button" class="btn" id="deny" title="Deny (Enter or Esc)">Deny</button>
      <button type="button" class="btn primary" id="allowOnce" data-allow>Allow once</button>
    </div>
  </div>

<script>
  const Core = window.BoardClipCore;
  const $ = id => document.getElementById(id);
  let current = null, remaining = 60, timer = null, decided = false, paused = false, armedAt = Infinity;
  // Glyphs match the ones the app uses for the same action (star = pin, sell =
  // group, edit_note = edit).
  const ICONS = {
    delete_clip:'delete', edit_clip:'edit_note', copy_to_clipboard:'content_copy', paste_clip:'content_paste_go',
    add_clip:'add', pin_clip:'star', set_numpad:'tag', assign_group:'sell',
    create_group:'new_label', delete_group:'label_off', read_clip:'visibility',
    search_all:'search', image_path:'image',
  };
  const KIND = {
    delete_clip:'deleting clips', edit_clip:'editing clip text', copy_to_clipboard:'writing your clipboard', paste_clip:'pasting into apps',
    add_clip:'adding clips', pin_clip:'pinning', set_numpad:'numpad slots', assign_group:'group changes',
    create_group:'group changes', delete_group:'group changes', read_clip:'reading private clips',
    search_all:'searching private clips', image_path:'revealing image paths',
  };
  // The prompt never takes focus (main shows it inactive) and never allows by
  // accident: Enter and Esc deny; allowing takes a click, or Ctrl+Enter
  // (Cmd+Enter on macOS) once the window has focus. The allow buttons arm a
  // moment after the prompt appears, so a click already on its way to
  // whatever was under the pointer cannot land on them.
  const ARM_MS = 800;
  const MOD = /Mac/i.test(navigator.platform) ? 'Cmd' : 'Ctrl';
  const armed = () => Date.now() >= armedAt;
  const allowButtons = () => [...document.querySelectorAll('[data-allow]')];

  // The appearance payload every window gets (main's windowAppearance): with
  // the request (plus main's resolved theme), then again on any change.
  function applyLook(look) {
    const root = document.documentElement;
    if (look.theme === 'light' || look.theme === 'dark') root.dataset.theme = look.theme;
    else if (look.themeMode) Core.applyTheme(root, look.themeMode, matchMedia('(prefers-color-scheme: dark)').matches);
    Core.applyAppearance(root, look);
  }
  if (window.approval.onSettings) window.approval.onSettings(applyLook);
  if (window.approval.onAppearanceChanged) window.approval.onAppearanceChanged(applyLook);

  function fit() {
    const h = Math.ceil(document.getElementById('wrap').getBoundingClientRect().bottom) + 4;
    if (window.approval && window.approval.resize) window.approval.resize(h);
  }
  function decide(choice) {
    if (decided || !current) return;
    if (choice !== 'deny' && choice !== 'timeout' && !armed()) return;
    decided = true;
    if (timer) clearInterval(timer);
    window.approval.decide(current.id, choice);
  }
  // The countdown stops while the mouse is over the prompt so it can be read
  // at leisure; main is told so its safety timer (and the waiting helper's
  // keepalive) follow. Leaving the window resumes from the same second.
  function setPaused(next) {
    if (decided || !current || paused === next) return;
    paused = next;
    $('countLabel').textContent = paused ? 'Paused while your mouse is over this' : "Denies automatically if you don't respond";
    $('countNum').textContent = paused ? 'paused' : remaining + 's';
    $('meter').classList.toggle('paused', paused);
    if (window.approval.hold) window.approval.hold(current.id, paused, remaining);
  }
  document.documentElement.addEventListener('mouseenter', () => setPaused(true));
  document.documentElement.addEventListener('mouseleave', () => setPaused(false));
  function tick() {
    if (paused) return;
    remaining -= 1;
    $('countNum').textContent = remaining + 's';
    $('meterBar').style.width = Math.max(0, (remaining / (current.timeoutSec || 60)) * 100) + '%';
    if (remaining <= 0) decide('timeout');
  }

  window.approval.onRequest(req => {
    current = req;
    remaining = req.timeoutSec || 60;
    const danger = !!req.danger;
    const kind = KIND[req.tool] || req.tool;
    $('title').textContent = req.title || 'Act on your clips';
    $('client').textContent = req.client || 'An AI assistant';
    $('badgeIcon').textContent = ICONS[req.tool] || 'smart_toy';
    $('badge').classList.toggle('danger', danger);
    $('allowOnce').classList.toggle('danger', danger);
    $('allowOnce').classList.toggle('primary', !danger);
    $('allowOnce').title = `Allow once (${MOD}+Enter). Enter and Esc deny.`;
    $('allowSession').title = `Allow ${kind} until BoardClip restarts`;
    $('allowAlways').textContent = `Always allow ${kind}`;
    $('allowAlways').title = `Never ask again before ${kind} (Settings > AI access lists what is always allowed)`;
    $('explain').textContent = req.explain || req.summary || '';
    $('why').textContent = req.why || '';
    $('whyRow').style.display = req.why ? '' : 'none';
    const facts = Array.isArray(req.facts) ? req.facts : [];
    $('facts').innerHTML = '';
    for (const [k, v] of facts) {
      const dt = document.createElement('dt'); dt.textContent = k;
      const dd = document.createElement('dd'); dd.textContent = v;
      $('facts').append(dt, dd);
    }
    $('facts').style.display = facts.length ? '' : 'none';
    const preview = req.preview && req.preview.text ? req.preview : (req.detail ? { label: 'Clip text', text: req.detail } : null);
    if (preview) { $('detailLabel').textContent = preview.label || 'Clip text'; $('detail').textContent = preview.text.trim(); $('detailCard').style.display = ''; }
    else { $('detailCard').style.display = 'none'; }
    $('countNum').textContent = remaining + 's';
    timer = setInterval(tick, 1000);
    for (const b of allowButtons()) b.disabled = true;
    armedAt = Date.now() + ARM_MS;
    setTimeout(() => { if (!decided) for (const b of allowButtons()) b.disabled = false; }, ARM_MS);
    requestAnimationFrame(fit);
    // Opened under a resting cursor: no mouseenter fires, so ask directly.
    requestAnimationFrame(() => { if (document.documentElement.matches(':hover')) setPaused(true); });
  });

  $('allowOnce').onclick = () => decide('once');
  $('allowSession').onclick = () => decide('session');
  $('allowAlways').onclick = () => decide('always');
  $('deny').onclick = () => decide('deny');
  // Capture phase, so a focused button never gets the key first: Enter on a
  // focused Allow still denies, and Space cannot press an allow button.
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); decide('deny'); return; }
    if (e.key === 'Enter') {
      e.preventDefault();
      if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey) decide('once');
      else decide('deny');
      return;
    }
    if (e.key === ' ' && e.target && e.target.closest && e.target.closest('[data-allow]')) e.preventDefault();
  }, true);
  window.addEventListener('keyup', e => {
    if (e.key === ' ' && e.target && e.target.closest && e.target.closest('[data-allow]')) e.preventDefault();
  }, true);
</script>
</body></html>

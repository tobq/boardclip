<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- BoardClip: a close-up of a clipboard's top corner, tilted and cropped by
       the tile (its clip, the board in the accent blue, the first lines, a
       second sheet behind it for the history) on the app's graphite. The one
       logo source: scripts/render-icons.js draws every app, installer and site
       icon from it. -->
  <defs>
    <clipPath id="tileClip"><rect width="512" height="512" rx="115"/></clipPath>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262b33"/>
      <stop offset="1" stop-color="#0f1216"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#e6e8eb"/>
      <stop offset="0.8" stop-color="#c3c8cf"/>
      <stop offset="1" stop-color="#8a929d"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <g transform="rotate(-13 256 256)">
      <rect x="128" y="132" width="520" height="560" rx="72" fill="url(#sheet)" fill-opacity=".85"/>
      <rect x="131" y="135" width="514" height="554" rx="69" fill="none" stroke="#93c5fd" stroke-opacity=".35" stroke-width="5"/>
      <g filter="url(#lift)">
        <rect x="30" y="190" width="540" height="560" rx="72" fill="url(#board)"/>
      </g>
      <rect x="33" y="193" width="534" height="554" rx="69" fill="none" stroke="#93c5fd" stroke-opacity=".6" stroke-width="6"/>
      <rect x="100" y="335" width="340" height="52" rx="26" fill="#ffffff"/>
      <rect x="100" y="430" width="230" height="52" rx="26" fill="#ffffff" fill-opacity=".6"/>
      <g filter="url(#lift)">
        <rect x="140" y="84" width="320" height="178" rx="52" fill="url(#metal)"/>
      </g>
      <rect x="143" y="87" width="314" height="172" rx="49" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="4"/>
      <rect x="240" y="118" width="120" height="40" rx="20" fill="#14171b"/>
    </g>
  </g>
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="4"/>
</svg>
